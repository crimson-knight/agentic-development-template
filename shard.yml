name: agentc_app_template_oss
version: 0.1.0

authors:
  - you <unknown@unknown.com>

crystal: 1.14.0

license: UNLICENSED

targets:
  agentc_app_template_oss:
    main: src/agentc_app_template_oss.cr

  amber:
    main: lib/amber/src/amber/cli.cr

dependencies:
  amber:
    github: crimson-knight/amber
    branch: master

  i18n:
    github: crimson-knight/i18n.cr
    version: ~> 0.4.1

  quartz_mailer:
    github: amberframework/quartz-mailer
    version: ~> 0.8.0

  jasper_helpers:
    github: amberframework/jasper-helpers
    version: ~> 1.2.2 

  pg:
    github: will/crystal-pg
    version: ~> 0.28.0

  grant:
    github: crimson-knight/grant
    branch: main

  gemma:
    github: crimson-knight/gemma
    branch: master

  asset_pipeline:
    github: amberframework/asset_pipeline
    # version: ~> 0.34.0
    branch: main

  # S3 support for Gemma in production (version managed by Gemma)
  # awscr-s3 is a transitive dependency through Gemma

  mcprotocol:
    github: crimson-knight/mcprotocol
    branch: main

  micrate:
    github: amberframework/micrate
    branch: master

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: ~> 1.5.0
